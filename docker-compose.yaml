services:
  rplay-live-dl:
    image: paverz/rplay-live-dl:v2.2.0-vibe
    container_name: rplay-live-dl
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Taipei
    volumes:
      - ./config:/app/config
      - ./archive:/app/archive
      - ./logs:/app/logs
    restart: unless-stopped
