name: Docker Build and Push

on:
    push:
        tags:
            - "v*"

jobs:
    docker-build-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Refuse to publish a tag that is not on main
              run: |
                  git fetch --no-tags origin main
                  git merge-base --is-ancestor "${{ github.sha }}" origin/main \
                    || { echo "::error::tag is not an ancestor of main"; exit 1; }

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  build-args: |
                      APP_GIT_SHA=${{ github.sha }}
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
